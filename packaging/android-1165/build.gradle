plugins { id 'com.android.application' version '8.11.1' }

// The developer signing key is committed at packaging/android-1165/keystore/
// horizon-1165-dev.jks. tools/android_build_1165.py exports its path and
// password through the environment; a CI secret can override the password.
def devKeystorePath = System.getenv('HORIZON_1165_KEYSTORE') ?:
        file('keystore/horizon-1165-dev.jks').absolutePath
def devKeystorePassword = System.getenv('HORIZON_1165_KEYSTORE_PASSWORD') ?:
        'horizon1165'

android {
    namespace 'dev.horizon.android1165'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rewixx.horizon1165'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.1.13-dev'
        ndk { abiFilters providers.gradleProperty('abi').getOrElse('arm64-v8a') }
    }
    signingConfigs {
        development {
            storeFile file(devKeystorePath)
            storePassword devKeystorePassword
            keyAlias 'horizon1165'
            keyPassword devKeystorePassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.development
        }
    }
    sourceSets.main {
        java.srcDirs = ['java']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android-1165/gradle-jni']
        assets.srcDirs = ['../../.local/android-1165/gradle-assets']
        // The launcher icon and HorizonGameTheme are shared with the existing
        // Android project; nothing Mojang-specific is copied into this tree.
        res.srcDirs = ['res', '../android/res']
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
}
layout.buildDirectory = file('../../.local/android-1165/gradle-build')
